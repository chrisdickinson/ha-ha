name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ha-ha-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ha-ha-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ha-ha-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ha-ha-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ha-ha-x86_64-pc-windows-msvc.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: ha-ha-aarch64-pc-windows-msvc.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ha-ha dist/
          cd dist
          tar czf ../${{ matrix.artifact }} ha-ha

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/ha-ha.exe dist/
          Compress-Archive -Path dist/ha-ha.exe -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # release-please has already created the release -- pushing the tag *is*
      # it creating the release, with the generated CHANGELOG as the body. So
      # this only attaches binaries; regenerating notes here would overwrite
      # that changelog with GitHub's auto-generated list. The `create` fallback
      # covers a `v*` tag pushed by hand, with no release-please run behind it.
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/* --clobber

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ha-ha-x86_64-unknown-linux-gnu.tar.gz
          path: artifacts/amd64

      - uses: actions/download-artifact@v4
        with:
          name: ha-ha-aarch64-unknown-linux-gnu.tar.gz
          path: artifacts/arm64

      - name: Stage binaries for Docker build
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar xzf artifacts/amd64/ha-ha-x86_64-unknown-linux-gnu.tar.gz -C dist/amd64
          tar xzf artifacts/arm64/ha-ha-aarch64-unknown-linux-gnu.tar.gz -C dist/arm64

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: chrisdickinson/ha-ha
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A separate repo, so this cannot ride along in the release-please PR: the
  # formula pins the sha256 of tarballs that do not exist until `build` has
  # run. `needs: release` rather than `needs: build` so the sums are taken
  # from the *published* assets -- the exact bytes brew will fetch.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the published unix assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --dir assets --pattern "*.tar.gz"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: chrisdickinson/homebrew-tap
          path: tap
          # GITHUB_TOKEN is scoped to this repo and cannot write to the tap.
          # HOMEBREW_TAP_TOKEN if you want a PAT scoped to just the tap;
          # otherwise RELEASE_PLEASE_TOKEN, which already reaches both if it
          # is a classic `repo`-scoped token.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}

      - name: Render and push Formula/ha-ha.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          .github/render-formula.sh "${TAG#v}" assets > tap/Formula/ha-ha.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ha-ha.rb

          # Re-tagging the same version renders the same file; nothing to say.
          if git diff --cached --quiet; then
            echo "formula already at ${TAG#v}"
            exit 0
          fi

          git commit -m "ha-ha ${TAG#v}"
          git push
