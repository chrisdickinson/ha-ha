name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked

  # Stable name for the branch ruleset to require. Matrix legs are named
  # `test (ubuntu-latest)` etc., so requiring them directly re-pins the ruleset
  # every time the matrix changes -- and a leg that is renamed away silently
  # stops being enforced. This job depends on the whole matrix instead.
  #
  # `if: always()` is load-bearing: without it a failed or cancelled leg leaves
  # this job *skipped*, and GitHub treats a skipped required check as passing.
  test-all:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: All test legs succeeded
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate the repo's own nomination file
        run: cargo run -q --locked -- validate ha-ha.kdl
